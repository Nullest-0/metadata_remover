<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Remover</title>
    <link rel="stylesheet" href="page.css">
</head>
<body>
    <h1>Metadata Remover</h1>
    <main>
        <label for="file-input">Upload files</label>
        <input type="file" id="file-input">
        <div class="preview">
            <img src="" id="the-file-preview">
            <div class="metadata-container">
                <div class="metadata"></div>
            </div>
        </div>
        <a href="" download hidden id="download-button">Download</a>
        <button hidden id="process-button">Process file</button>
        <button hidden id="remove-all-button">Remove all metadata</button>
    </main>
</body>
<script type="module" src="page.js"></script>
</html>
